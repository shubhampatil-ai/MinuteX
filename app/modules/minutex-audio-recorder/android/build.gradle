apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.minutexaudiorecorder'
version = '1.0.0'

android {
  namespace 'expo.modules.minutexaudiorecorder'
  compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35

  defaultConfig {
    minSdk rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation project(':expo-modules-core')
  // NotificationCompat (mic foreground service notification) comes from
  // expo-modules-core, which exposes androidx.core via `api`. Pinning our own
  // version here risked downgrading the app-wide one.
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion : '2.0.21'}"
}
