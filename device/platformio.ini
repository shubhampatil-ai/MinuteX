; =============================================================================
; PlatformIO build for the ESP_32 firmware — exists for ONE reason:
; raising the lwIP TCP send buffer, which the Arduino IDE cannot do because it
; ships precompiled IDF libraries.
;
; Throughput on this device is (lwIP send buffer / RTT). Measured against S3
; ap-south-1: 5744 B buffer / ~42 ms effective RTT = 136 KB/s. The
; custom_sdkconfig block below rebuilds the IDF libs with a 64 KB buffer,
; raising the TCP ceiling to ~1.5 MB/s (the SD card at ~1.1 MB/s becomes the
; next constraint). See _archive/dead-code/benchmark_server/FINDINGS.md for the measurement trail.
;
; The sketch source in device/src/ is untouched and still builds in the Arduino
; IDE — but an IDE build uses the stock 5744 B libs, so ONLY binaries built
; here carry the tuning. The UPLOAD ANALYSIS REPORT prints the compiled-in
; values (lwIP snd buf / TCP wnd), so a serial log always tells you which
; build is running.
;
; First build: pioarduino downloads toolchains + IDF sources and recompiles
; the affected libs (several GB, 20-45 min). Subsequent builds are cached and
; take seconds.
;
;   build:   pio run
;   flash:   pio run -t upload            (auto-detects COM port)
;   monitor: pio device monitor -b 115200
; =============================================================================

[platformio]
src_dir = src
default_envs = esp32s3_n16r8
; ESP-IDF's build system cannot handle spaces in paths, and the default
; PlatformIO core dir lives under C:\Users\Shubham Patil\... — the space in
; the username kills the custom_sdkconfig lib rebuild with "Detected a
; whitespace character in project paths". Pinning the core dir to a
; space-free location fixes it permanently and keeps the fix in the repo
; instead of in a machine-specific environment variable. Toolchains and
; packages (~2 GB) install here on first build.
core_dir = C:\ai_voicebot_kalyan\.piocore

[env:esp32s3_n16r8]
; pioarduino fork — the maintained platform for Arduino core 3.x. Pinned to a
; release (Arduino 3.3.11 / IDF 5.5.5, one patch ahead of the IDE's 3.3.10 /
; 5.5.4 — same stable line). To upgrade later, bump this one URL.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; ---- ESP32-S3 N16R8: 16 MB QIO flash + 8 MB OPI PSRAM ----------------------
; Mirrors the Arduino IDE selection "PSRAM: OPI, Flash: 16MB, Partition:
; app3M_fat9M_16MB" that every binary so far was built with.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
; The CSV is VENDORED at the project root (copied from the Arduino core's
; tools/partitions/). Plain-Arduino builds resolve this name from the
; framework package, but custom_sdkconfig's hybrid espidf mode resolves it
; relative to the project dir — build 5 failed with "Missing partition table
; file" until the file existed here. Identical layout to the IDE's
; app3M_fat9M_16MB scheme every prior binary used.
board_build.partitions = app3M_fat9M_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial -> native USB CDC, matching the Arduino IDE's "USB CDC On Boot:
    ; Enabled" this board was always run with. Without these, Serial prints go
    ; to UART0 (bare pins 43/44) and the monitor on COM7 shows ONLY low-level
    ; ESP-IDF [E] logs — the firmware looks dead while running fine. That was
    ; the symptom on the first PIO-built flash.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

; The sketch body lives in Main.cpp (see its header comment); the .ino is a
; comment-only stub kept for Arduino-IDE compatibility. Excluding *.ino here
; skips PlatformIO's fragile ino->cpp converter entirely, which failed on
; this project (_gcc_preprocess assertion) and is unnecessary for code that
; already includes <Arduino.h>.
build_src_filter = +<*> -<*.ino> -<*.bak>

; NeoPixel is the firmware's only external library (Driver_RGB). Same major
; version the IDE build used.
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.15.5

; ---- The point of this file: rebuild the IDF libs with these deltas --------
; custom_sdkconfig is a pioarduino feature: it recompiles the precompiled
; Arduino/IDF static libraries locally with these Kconfig values applied.
custom_sdkconfig =
    ; 64 KB of in-flight TCP data instead of 5744 B. This is the upload
    ; throughput fix: ceiling goes from ~136 KB/s to ~1.5 MB/s at the
    ; measured ~42 ms effective RTT to ap-south-1.
    CONFIG_LWIP_TCP_SND_BUF_DEFAULT=65535
    ; Receive window to match. Irrelevant to uploads, helps any future
    ; download path, costs nothing with PSRAM-backed pbufs.
    CONFIG_LWIP_TCP_WND_DEFAULT=65535
    ; REQUIRED companion to the 64 KB buffer: WiFi/lwIP allocations go
    ; PSRAM-first. Without this, send-buffer pbufs come from internal DRAM,
    ; which measured 35 KB free / 7.6 KB largest block during a TLS upload —
    ; queueing 64 KB there would fail allocation and kill every upload.
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    ; mbedTLS allocates from PSRAM. The TLS session was the measured single
    ; largest DRAM consumer (~49 KB); this converts the chronic DRAM pressure
    ; documented in FINDINGS.md into a non-issue.
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    ; Enables READING the socket send buffer via getsockopt(SO_SNDBUF) for
    ; diagnostics. Note lwIP does not support SETTING it at runtime — the
    ; buffer size is fixed by CONFIG_LWIP_TCP_SND_BUF_DEFAULT above.
    CONFIG_LWIP_SO_SNDBUF=y

; Deliberately NOT set (was considered and rejected):
;   CONFIG_LWIP_WND_SCALE / CONFIG_LWIP_TCP_RCV_SCALE — window scaling enlarges
;     the window WE advertise (receive direction). Upload throughput is bounded
;     by OUR send buffer, not by what we advertise to S3. Zero upload gain,
;     extra per-socket RAM.
;   CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=16384 — the Arduino core's ssl_client
;     fragments writes to 4096 B internally regardless, so larger TLS records
;     never materialize; per-record overhead at 4096 is ~1% anyway.
