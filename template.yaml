  # ===========================================================================
  # CLOUDWATCH LOGS  --  three Lambda log groups
  #
  # EXISTING STATE PRESERVED: RetentionInDays is intentionally OMITTED on all
  # three, because retention is NOT SET in the deployed account (logs never
  # expire). No KMS key is configured on any group; log class is STANDARD.
  # Setting a retention here would be a CHANGE, not a capture.
  # ===========================================================================

  UserApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/userApi
      # RetentionInDays omitted -- never expires in the deployed account.

  GetUploadUrlLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/getUploadUrl
      # RetentionInDays omitted -- never expires in the deployed account.

  TranscribeRecordingLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/transcribeRecording
      # RetentionInDays omitted -- never expires in the deployed account.

      # ===========================================================================
      # API GATEWAY  --  HTTP API (v2) 'iot-audio-api', deployed id q87zfn5vyj
      #
      # 105 routes, ONE stage ($default) with AutoDeploy enabled.
      #   102 routes -> userApi
      #     3 routes -> getUploadUrl
      #
      # AUTHORIZATION: every one of the 105 routes has AuthorizationType NONE and
      # ApiKeyRequired false. There are NO API Gateway authorizers in the account.
      # All authentication and authorization happens INSIDE the Lambda code (JWT
      # via _require_auth, x-api-key for device routes, HMAC-SHA256 for the STT
      # webhook, sha256 token for share links). Existing state, preserved.
      #
      # CORS: no CorsConfiguration is set on the API and the Lambdas return no
      # Access-Control-* headers. The clients are a native app and the ESP32
      # firmware, so no browser preflight is involved. Preserved as-is.
      #
      # THROTTLING: no route settings and no explicit stage throttle are
      # configured; DetailedMetricsEnabled is false; no stage access logging.
      #
      # The routes are declared below as SAM function Events (HttpApi), which is
      # what makes the API-to-Lambda wiring render in Infrastructure Composer.
      # ===========================================================================

  MinuteXHttpApi:
    Type: AWS::Serverless::HttpApi
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: iot-audio-api
      Description: MinuteX public HTTP API. Deployed API id q87zfn5vyj.
      StageName: $default
      # AutoDeploy is true on the deployed $default stage.
      # No Auth block: no authorizer exists in the account.
      # No CorsConfiguration: none is set on the deployed API.

      # ===========================================================================
      # LAMBDA  --  three functions, all python3.12 / x86_64 / 256 MB
      #
      # EXISTING STATE PRESERVED ON ALL THREE:
      #   Layers                    none
      #   VpcConfig                 none (no function is VPC-attached)
      #   DeadLetterConfig          none
      #   EventInvokeConfig         none (no OnSuccess/OnFailure destinations)
      #   ReservedConcurrency       not set
      #   ProvisionedConcurrency    not set
      #   Tracing                   PassThrough (X-Ray not enabled)
      #   FunctionUrlConfig         none
      #   SnapStart                 None
      #   EphemeralStorage          512 MB (default)
      #   Tags                      none
      #   LoggingConfig             Text format, default log group
      #
      # CodeUri points at the real source directory in this repo, but the DEPLOYED
      # zips also vendor the cloud/shared/*.py modules (groq_client, prompts,
      # ai_schema, transcript_store, pageindex, pageindex_store, ...) at the
      # package root. That vendoring is done by cloud/scripts/_package_lambda.py,
      # NOT by SAM, so `sam build` against this template would NOT reproduce the
      # deployed artifact. Documented, not worked around.
      # ===========================================================================

  UserApiFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # The main application API. Serves 102 of the 105 HTTP API routes: auth, recordings, AI workspace, per-meeting and workspace chat, tasks, CRM, Gmail, shares, notifications, and the ElevenLabs STT webhook. Also handles an internal asynchronous tasks.seed invoke from transcribeRecording.
    Properties:
      FunctionName: userApi
      Description: Main application API - 102 HTTP routes plus the ElevenLabs STT
        webhook and an internal task-seeding invoke.
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 29
      # Existing deployed role, referenced by ARN rather than generated by
      # SAM, so no new policy is ever synthesised for these functions.
      Role: !GetAtt UserApiRole.Arn
      CodeUri: cloud/functions/userapi/
      Tracing: PassThrough # X-Ray not enabled in the deployed account
      # ---------------------------------------------------------------
      # ENVIRONMENT VARIABLES -- 53 variables, NAMES ONLY.
      # Every value below is a REDACTED placeholder. The real values were
      # never read during capture and MUST NOT be committed here.
      #
      # SECURITY NOTE (existing deployed state, not changed):
      # GROQ_API_KEY and ELEVENLABS_API_KEY are stored as PLAINTEXT Lambda
      # environment variables, while the other four secrets correctly use
      # Secrets Manager. Captured as-is; see AWS_ARCHITECTURE.md risks.
      # ---------------------------------------------------------------
      Environment:
        Variables:
          AI_CONTEXT_DEADLINE_SECONDS: !Ref RedactedPlaceholder # [REDACTED]
          AI_CONTEXT_MAX_CHARS: !Ref RedactedPlaceholder # [REDACTED]
          AI_INTEL_MAX_TASKS: !Ref RedactedPlaceholder # [REDACTED]
          AI_MAX_TOOL_HOPS: !Ref RedactedPlaceholder # [REDACTED]
          AI_TOOL_ROW_LIMIT: !Ref RedactedPlaceholder # [REDACTED]
          AVATAR_URL_EXPIRY: !Ref RedactedPlaceholder # [REDACTED]
          BUCKET_NAME: !Ref RedactedPlaceholder # [REDACTED]
          CHAT_SESSIONS_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          CHAT_SESSIONS_USER_INDEX: !Ref RedactedPlaceholder # [REDACTED]
          CONTACTS_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          CRM_CONNECTIONS_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          ELEVENLABS_API_KEY: !Ref RedactedPlaceholder # [REDACTED - plaintext secret in deployed env]
          ELEVENLABS_WEBHOOK_SECRET_ARN: !Ref RedactedPlaceholder # [REDACTED]
          FOLDERS_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          FOLDER_CONTACTS_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          GOOGLE_CLIENT_ID: !Ref RedactedPlaceholder # [REDACTED]
          GOOGLE_CLIENT_SECRET_ARN: !Ref RedactedPlaceholder # [REDACTED]
          GOOGLE_REDIRECT_URI: !Ref RedactedPlaceholder # [REDACTED]
          GROQ_API_KEY: !Ref RedactedPlaceholder # [REDACTED - plaintext secret in deployed env]
          GROQ_CONTEXT_TOKENS: !Ref RedactedPlaceholder # [REDACTED]
          GROQ_MODEL: !Ref RedactedPlaceholder # [REDACTED]
          GROQ_TPM_LIMIT: !Ref RedactedPlaceholder # [REDACTED]
          INTEGRATIONS_KMS_KEY_ID: !Ref RedactedPlaceholder # [REDACTED]
          INTEGRATIONS_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          INTEGRATION_RETURN_URL: !Ref RedactedPlaceholder # [REDACTED]
          JWT_SECRET_ARN: !Ref RedactedPlaceholder # [REDACTED]
          JWT_TTL: !Ref RedactedPlaceholder # [REDACTED]
          MAX_AVATAR_BYTES: !Ref RedactedPlaceholder # [REDACTED]
          MAX_DURATION_SECONDS: !Ref RedactedPlaceholder # [REDACTED]
          MAX_SESSION_TURNS: !Ref RedactedPlaceholder # [REDACTED]
          MAX_UPLOAD_BYTES: !Ref RedactedPlaceholder # [REDACTED]
          MEETING_PARTICIPANTS_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          NOTIFICATIONS_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          NOTIFICATION_DEDUPE_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          ONDEMAND_DEADLINE_SECONDS: !Ref RedactedPlaceholder # [REDACTED]
          PAGEINDEX_LLM_SUMMARY: !Ref RedactedPlaceholder # [REDACTED]
          PAGEINDEX_LOCK_TTL: !Ref RedactedPlaceholder # [REDACTED]
          PAGEINDEX_PREFIX: !Ref RedactedPlaceholder # [REDACTED]
          PAGEINDEX_RETRIEVAL_DEADLINE: !Ref RedactedPlaceholder # [REDACTED]
