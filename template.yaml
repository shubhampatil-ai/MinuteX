# =============================================================================
# IMPORTANT:
# This template is an architecture capture of an existing manually deployed
# MinuteX AWS environment.
#
# It has NOT been validated for deployment and must NOT be deployed against
# the production AWS account without a separate migration/import plan.
#
# Every resource below ALREADY EXISTS in account 624734879550 (ap-south-1),
# created by the numbered shell scripts in cloud/scripts/. Running create-stack
# with this template would attempt to create DUPLICATES and fail on the names
# that must be globally or regionally unique (the S3 bucket, the DynamoDB
# tables, the IAM roles). Adopting it requires CloudFormation resource IMPORT,
# not a deploy. See AWS_ARCHITECTURE.md.
#
# NO SECRET VALUES APPEAR IN THIS FILE. Lambda environment variables are
# represented by NAME only; every value is a REDACTED placeholder or a
# CloudFormation parameter. The four Secrets Manager secrets are referenced
# by ARN and their contents are never read.
# =============================================================================
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  MinuteX production architecture captured from AWS account 624734879550 in ap-south-1. This template is for architecture visualization (AWS Infrastructure Composer) and IaC migration planning. It must not be deployed directly.

# -----------------------------------------------------------------------------
# EXTERNAL (NON-AWS) SERVICES  --  documented here, deliberately NOT modelled
# as CloudFormation resources because they are third-party HTTP APIs.
#
#   transcribeRecording --> ElevenLabs Scribe   api.elevenlabs.io
#                             POST /v1/speech-to-text, model scribe_v2,
#                             source_url + webhook=true, diarize=true
#   ElevenLabs          --> userApi             POST /webhooks/elevenlabs/stt
#                             inbound callback, HMAC-SHA256 verified
#   transcribeRecording --> Groq                api.groq.com (staged analysis)
#   userApi             --> Groq                api.groq.com (on-demand AI, chat)
#   userApi             --> Google OAuth+Gmail  accounts.google.com,
#                             oauth2.googleapis.com, gmail.googleapis.com
#   userApi             --> Salesforce REST     login.salesforce.com + instance
#
# NOTE: Google OAuth here is the GMAIL INTEGRATION only. There is no Google
# Sign-In backend; the app's Google button is UI-only (coming soon).
# -----------------------------------------------------------------------------
Metadata:
  Capture:
    Account: '624734879550'
    Region: ap-south-1
    Method: read-only AWS CLI describe/get calls
    Purpose: architecture visualization and IaC migration planning
    Deployed: false
    ExternalServices:
      - ElevenLabs Scribe (STT)
      - Groq (LLM)
      - Google OAuth + Gmail API (integration only, NOT sign-in)
      - Salesforce REST API (CRM)

Parameters:

  # Every Lambda environment variable is represented by this single placeholder
  # parameter. The deployed values were never read during capture.
  RedactedPlaceholder:
    Type: String
    Default: REDACTED
    Description: |
      Placeholder standing in for a redacted environment-variable value. The real values live only in the deployed Lambda configurations.

Resources:

  # ===========================================================================
  # IAM  --  Lambda execution roles
  #
  # Reproduced EXACTLY as deployed. Overly broad grants are PRESERVED and
  # annotated; they are not corrected here, because the purpose of this file
  # is to represent the current system, not to redesign its security model.
  # ===========================================================================

  UserApiRole:
    Type: AWS::IAM::Role
    # Existing deployed role. Retained on stack delete so an import can
    # never destroy the live role.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: userApi-aps1
      Description: Execution role for the userApi Lambda function
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # No managed policies attached in the deployed account.
      # Existing deployed permission. Not changed during architecture capture.
      # 13 inline policies and NO managed policies -- not even
      # AWSLambdaBasicExecutionRole; CloudWatch Logs access is granted by the
      # 'Logs' statement inside userApi-inline instead.
      Policies:
        - PolicyName: MinuteXChatSessionsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/ChatSessions
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/ChatSessions/index/*
        - PolicyName: lambda-notifications
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: NotificationsTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Notifications
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Notifications/index/*
              - Sid: NotificationDedupeClaims
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: arn:aws:dynamodb:ap-south-1:624734879550:table/NotificationDedupe
        - PolicyName: userApi-avatars
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AvatarObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: arn:aws:s3:::meeting-recorder-shubham-aps1/avatars/*
        - PolicyName: userApi-crm-salesforce
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CrmConnections
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: arn:aws:dynamodb:ap-south-1:624734879550:table/CrmConnections
              - Sid: SalesforceTokenKms
                Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                Resource: arn:aws:kms:ap-south-1:624734879550:key/b5a78676-4c51-4ba4-8f2a-bb0a77bfcec4
              - Sid: SalesforceClientSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: arn:aws:secretsmanager:ap-south-1:624734879550:secret:userApi/salesforceClientSecret-vUDtk6
        - PolicyName: userApi-inline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:ap-south-1:624734879550:*
              - Sid: Users
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  # BatchGetItem is what the members list and meeting
                  # attribution read profiles with (_users_by_ids). Without
                  # it those reads fail AccessDenied, get swallowed by a
                  # defensive except, and every name renders as a raw uuid.
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Users
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Users/index/*
              - Sid: UserDevices
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:DeleteItem
                Resource: arn:aws:dynamodb:ap-south-1:624734879550:table/UserDevices
              - Sid: DeviceKeysRead
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: arn:aws:dynamodb:ap-south-1:624734879550:table/DeviceKeys
              - Sid: Devices
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Devices
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Devices/index/*
              - Sid: Recordings
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Recordings
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Recordings/index/*
              - Sid: JwtSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: arn:aws:secretsmanager:ap-south-1:624734879550:secret:userApi/jwtSecret-fxK2Iv
              - Sid: GetAudio
                Effect: Allow
                Action: s3:GetObject
                Resource: arn:aws:s3:::meeting-recorder-shubham-aps1/*
        - PolicyName: userApi-integrations-gmail
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: IntegrationsTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: arn:aws:dynamodb:ap-south-1:624734879550:table/Integrations
              - Sid: IntegrationTokenKms
                Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                Resource: arn:aws:kms:ap-south-1:624734879550:key/33f5f31c-5c64-4826-9e64-588b70a12645
              - Sid: GoogleClientSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: arn:aws:secretsmanager:ap-south-1:624734879550:secret:userApi/googleClientSecret-r13TXA
        - PolicyName: userApi-invoke-transcribe
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeTranscribeForReprocess
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - arn:aws:lambda:ap-south-1:624734879550:function:transcribeRecording
                  - arn:aws:lambda:ap-south-1:624734879550:function:transcribeRecording:*
        - PolicyName: userApi-pageindex
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PageIndexReadWrite
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: arn:aws:s3:::meeting-recorder-shubham-aps1/pageindex/*
        - PolicyName: userApi-permanent-delete
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PermanentDeleteObjects
                Effect: Allow
                Action: s3:DeleteObject
                Resource:
                  - arn:aws:s3:::meeting-recorder-shubham-aps1/recordings/*
                  - arn:aws:s3:::meeting-recorder-shubham-aps1/transcripts/*
                  - arn:aws:s3:::meeting-recorder-shubham-aps1/pageindex/*
              - Sid: PermanentDeleteRow
                Effect: Allow
                Action: dynamodb:DeleteItem
                Resource: arn:aws:dynamodb:ap-south-1:624734879550:table/Recordings
        - PolicyName: userApi-shares
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Shares
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Shares/index/*
        - PolicyName: userApi-stt-webhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteDeliveredTranscripts
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: arn:aws:s3:::meeting-recorder-shubham-aps1/transcripts/*
              - Sid: ReadWebhookSigningSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: arn:aws:secretsmanager:ap-south-1:624734879550:secret:userApi/elevenlabsWebhookSecret-pnuv3j
        - PolicyName: userApi-upload-presign
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PresignedUserUploads
                Effect: Allow
                Action: s3:PutObject
                Resource: arn:aws:s3:::meeting-recorder-shubham-aps1/recordings/*
        - PolicyName: userApi-workspace-org
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WorkspaceOrgTables
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                Resource:
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Contacts
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Folders
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/FolderContacts
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/MeetingParticipants
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Tasks
              - Sid: WorkspaceOrgIndexes
                Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Contacts/index/*
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Folders/index/*
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/FolderContacts/index/*
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/MeetingParticipants/index/*
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Tasks/index/*

  GetUploadUrlRole:
    Type: AWS::IAM::Role
    # Existing deployed role. Retained on stack delete so an import can
    # never destroy the live role.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: getUploadUrl-aps1
      Description: Execution role for the getUploadUrl Lambda function
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      # Existing deployed permission. Not changed during architecture capture.
      # This role carries THREE overlapping inline policies that each grant
      # s3:PutObject on the WHOLE bucket (.../*) rather than recordings/*.
      # Because a presigned URL inherits the signer's permissions, this is
      # broader than the function needs. Preserved verbatim.
      Policies:
        - PolicyName: device-presign-inline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:ap-south-1:624734879550:*
              - Sid: DeviceKeysRead
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: arn:aws:dynamodb:ap-south-1:624734879550:table/DeviceKeys
              - Sid: DevicesReadTouch
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: arn:aws:dynamodb:ap-south-1:624734879550:table/Devices
              - Sid: PutRecordings
                Effect: Allow
                Action: s3:PutObject
                Resource: arn:aws:s3:::meeting-recorder-shubham-aps1/*
        - PolicyName: get-upload-url-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PresignPutRecordings
                Effect: Allow
                Action: s3:PutObject
                Resource: arn:aws:s3:::meeting-recorder-shubham-aps1/*
              - Sid: ReadDeviceKeys
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: arn:aws:dynamodb:ap-south-1:624734879550:table/DeviceKeys
        - PolicyName: getUploadUrl-inline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PutAudioObjects
                Effect: Allow
                Action: s3:PutObject
                Resource: arn:aws:s3:::meeting-recorder-shubham-aps1/*
              - Sid: ReadDeviceKeys
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: arn:aws:dynamodb:ap-south-1:624734879550:table/DeviceKeys
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:ap-south-1:624734879550:*

  TranscribeRecordingRole:
    Type: AWS::IAM::Role
    # Existing deployed role. Retained on stack delete so an import can
    # never destroy the live role.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: transcribeRecording-aps1
      Description: Execution role for the transcribeRecording Lambda function
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      # Existing deployed permission. Not changed during architecture capture.
      Policies:
        - PolicyName: lambda-notifications
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: NotificationsTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Notifications
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Notifications/index/*
              - Sid: NotificationDedupeClaims
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: arn:aws:dynamodb:ap-south-1:624734879550:table/NotificationDedupe
        - PolicyName: transcribe-crm-config-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CrmConnectionsRead
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: arn:aws:dynamodb:ap-south-1:624734879550:table/CrmConnections
        - PolicyName: transcribe-invoke-userapi
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeUserApiForTaskSeeding
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - arn:aws:lambda:ap-south-1:624734879550:function:userApi
                  - arn:aws:lambda:ap-south-1:624734879550:function:userApi:*
        - PolicyName: transcribe-pageindex
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PageIndexWrite
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: arn:aws:s3:::meeting-recorder-shubham-aps1/pageindex/*
        - PolicyName: transcribe-recording-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PresignAndReadAudioObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: arn:aws:s3:::meeting-recorder-shubham-aps1/*
              - Sid: WriteOffloadedTranscripts
                Effect: Allow
                Action: s3:PutObject
                Resource: arn:aws:s3:::meeting-recorder-shubham-aps1/transcripts/*
              - Sid: UpsertAndReadRecordings
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Recordings
                  - arn:aws:dynamodb:ap-south-1:624734879550:table/Recordings/index/*

  # ===========================================================================
  # KMS  --  two customer-managed symmetric CMKs
  #
  # Used at the APPLICATION layer by userApi to envelope-encrypt per-user OAuth
  # refresh tokens before they are written to DynamoDB. Automatic key rotation
  # is DISABLED on both (existing state, not changed).
  #
  # The KeyPolicy below is a MINIMAL REPRESENTATION, not a byte-for-byte copy:
  # kms:GetKeyPolicy was not called during capture. Treat the policy body as
  # UNVERIFIED and re-read it before any import. See AWS_ARCHITECTURE.md.
  # ===========================================================================

  CrmSalesforceKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Deployed key id: b5a78676-4c51-4ba4-8f2a-bb0a77bfcec4
    Properties:
      Description: Envelope-encrypts per-user CRM OAuth refresh tokens (MinuteX)
      KeyUsage: ENCRYPT_DECRYPT
      KeySpec: SYMMETRIC_DEFAULT
      Enabled: true
      EnableKeyRotation: false # existing deployed state
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
  CrmSalesforceKeyAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AliasName: alias/crm-salesforce
      TargetKeyId: !Ref CrmSalesforceKey

  IntegrationsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Deployed key id: 33f5f31c-5c64-4826-9e64-588b70a12645
    Properties:
      Description: Envelope-encrypts per-user integration OAuth refresh tokens (MinuteX)
      KeyUsage: ENCRYPT_DECRYPT
      KeySpec: SYMMETRIC_DEFAULT
      Enabled: true
      EnableKeyRotation: false # existing deployed state
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
  IntegrationsKeyAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AliasName: alias/minutex-integrations
      TargetKeyId: !Ref IntegrationsKey

  # ===========================================================================
  # SECRETS MANAGER  --  four secrets, all read by userApi only
  #
  # NO SecretString AND NO GenerateSecretString IS DECLARED, DELIBERATELY.
  # Declaring either would embed a real secret in version control, or
  # OVERWRITE the live secret with a generated value on a future update.
  # Only the name and description are captured; the values were never read.
  #
  # The Lambda reads these at runtime with secretsmanager:GetSecretValue,
  # using the *_ARN environment variables -- NOT with a
  # {{resolve:secretsmanager:...}} template reference. Adding a resolve here
  # would misrepresent the deployed mechanism, so none is used.
  #
  # Rotation is not configured on any of the four (existing state).
  # ===========================================================================

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Deployed ARN: arn:aws:secretsmanager:ap-south-1:624734879550:secret:userApi/jwtSecret-fxK2Iv
    Properties:
      Name: userApi/jwtSecret
      Description: HS256 signing key for MinuteX JWTs. Read by userApi via JWT_SECRET_ARN.
      # SecretString intentionally omitted -- see the section note above.

  GoogleClientSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Deployed ARN: arn:aws:secretsmanager:ap-south-1:624734879550:secret:userApi/googleClientSecret-r13TXA
    Properties:
      Name: userApi/googleClientSecret
      Description: Google OAuth client secret (MinuteX Gmail integration)
      # SecretString intentionally omitted -- see the section note above.

  SalesforceClientSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Deployed ARN: arn:aws:secretsmanager:ap-south-1:624734879550:secret:userApi/salesforceClientSecret-vUDtk6
    Properties:
      Name: userApi/salesforceClientSecret
      Description: Salesforce Connected App consumer secret (MinuteX CRM OAuth)
      # SecretString intentionally omitted -- see the section note above.

  ElevenLabsWebhookSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Deployed ARN: arn:aws:secretsmanager:ap-south-1:624734879550:secret:userApi/elevenlabsWebhookSecret-pnuv3j
    Properties:
      Name: userApi/elevenlabsWebhookSecret
      Description: ElevenLabs STT webhook HMAC signing secret
      # SecretString intentionally omitted -- see the section note above.

      # ===========================================================================
      # S3  --  the single bucket in the account
      #
      # Holds all audio, transcripts, PageIndex trees and avatars. No Lambda ever
      # moves audio bytes: clients PUT and GET directly via presigned URLs.
      #
      # Prefixes in use (S3 has no prefix resource; documented for Composer):
      #   recordings/{user_id}/{device_id|mobile|uploads}/{recording_id}.{ext}
      #   transcripts/<recording key>.transcript.json.gz
      #   pageindex/<recording key>.pageindex.json.gz
      #   avatars/{user_id}/{user|contact}/<file>
      #   esp32-001/  (LEGACY, pre-user-ownership layout)
      #
      # EXISTING STATE PRESERVED: versioning is NOT enabled, there is NO lifecycle
      # rule, NO CORS configuration and NO bucket policy. Encryption is SSE-S3
      # (AES256) with a bucket key; object ownership is BucketOwnerEnforced; all
      # four public-access blocks are on. No bucket tags.
      # ===========================================================================

  RecordingsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: TranscribeRecordingS3InvokePermission
    Properties:
      BucketName: meeting-recorder-shubham-aps1
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # S3 -> Lambda trigger, as deployed (notification id transcribe-on-audio).
      # NO prefix and NO suffix filter are configured in AWS: EVERY ObjectCreated
      # event on this bucket -- including avatar, transcript and pageindex writes
      # -- invokes transcribeRecording, which then filters by audio extension in
      # code. Existing state, preserved.
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt TranscribeRecordingFunction.Arn

  # ===========================================================================
  # DYNAMODB  --  16 tables
  #
  # EXISTING STATE PRESERVED ACROSS ALL 16:
  #   BillingMode                  PAY_PER_REQUEST
  #   PointInTimeRecovery          DISABLED
  #   DeletionProtection           DISABLED
  #   Streams                      none
  #   SSESpecification             omitted -> AWS-owned default key
  #                                (no table reported an SSEDescription)
  #   Local secondary indexes      none
  #   Tags                         none
  #   TTL                          only NotificationDedupe (expires_at)
  #
  # Every GSI projects ALL attributes, as deployed.
  # ===========================================================================

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # User accounts. Password hashes are scrypt (stdlib); login goes through the email-index GSI.
    Properties:
      TableName: Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false # existing deployed state
      DeletionProtectionEnabled: false # existing deployed state

  RecordingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # One item per meeting: status lifecycle, AI output, and POINTERS to the S3 transcript / PageIndex objects (the transcript itself is offloaded to S3 to stay under the 400 KB item limit).
    Properties:
      TableName: Recordings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: audio_s3_key
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: device_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: audio_s3_key
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: device-index
          KeySchema:
            - AttributeName: device_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false # existing deployed state
      DeletionProtectionEnabled: false # existing deployed state

  TasksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # AI-extracted and manually created tasks. Six GSIs serve owner, assignee (contact and user), folder, source meeting, and fingerprint dedupe.
