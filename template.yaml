  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Device-facing API (3 routes). Authenticates the ESP32-S3 by x-api-key, requires the device to be PAIRED, and returns a presigned S3 PUT. Also handles heartbeat and upload-complete.
    Properties:
      FunctionName: getUploadUrl
      Description: Device-facing API - presign, heartbeat and upload-complete for the
        ESP32-S3, authenticated by x-api-key.
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 10
      # Existing deployed role, referenced by ARN rather than generated by
      # SAM, so no new policy is ever synthesised for these functions.
      Role: !GetAtt GetUploadUrlRole.Arn
      CodeUri: cloud/functions/device-presign/
      Tracing: PassThrough # X-Ray not enabled in the deployed account
      # ---------------------------------------------------------------
      # ENVIRONMENT VARIABLES -- 4 variables, NAMES ONLY.
      # Every value below is a REDACTED placeholder. The real values were
      # never read during capture and MUST NOT be committed here.
      # ---------------------------------------------------------------
      Environment:
        Variables:
          BUCKET_NAME: !Ref RedactedPlaceholder # [REDACTED]
          DEVICES_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          TABLE_NAME: !Ref RedactedPlaceholder # [REDACTED]
          URL_EXPIRY: !Ref RedactedPlaceholder # [REDACTED]
      # ---------------------------------------------------------------
      # API GATEWAY ROUTES -- 3 routes, all AuthorizationType NONE.
      # ---------------------------------------------------------------
      Events:
        Route001:
          Type: HttpApi
          Properties:
            ApiId: !Ref MinuteXHttpApi
            Method: get
            Path: /get-upload-url
        Route002:
          Type: HttpApi
          Properties:
            ApiId: !Ref MinuteXHttpApi
            Method: post
            Path: /device/heartbeat
        Route003:
          Type: HttpApi
          Properties:
            ApiId: !Ref MinuteXHttpApi
            Method: post
            Path: /device/upload-complete

  TranscribeRecordingFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Transcription + AI analysis. Two entry points: (A) an S3 ObjectCreated event STARTS an asynchronous ElevenLabs job and exits in ~2s; (B) an asynchronous stt.completed invoke from userApi runs the Groq analysis and persistence path.
    Properties:
      FunctionName: transcribeRecording
      Description: Transcription and AI analysis - S3-triggered async STT start, plus
        the stt.completed analysis path.
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 300
      # Existing deployed role, referenced by ARN rather than generated by
      # SAM, so no new policy is ever synthesised for these functions.
      Role: !GetAtt TranscribeRecordingRole.Arn
      CodeUri: cloud/functions/transcribe/
      Tracing: PassThrough # X-Ray not enabled in the deployed account
      # ---------------------------------------------------------------
      # ENVIRONMENT VARIABLES -- 19 variables, NAMES ONLY.
      # Every value below is a REDACTED placeholder. The real values were
      # never read during capture and MUST NOT be committed here.
      #
      # SECURITY NOTE (existing deployed state, not changed):
      # GROQ_API_KEY and ELEVENLABS_API_KEY are stored as PLAINTEXT Lambda
      # environment variables, while the other four secrets correctly use
      # Secrets Manager. Captured as-is; see AWS_ARCHITECTURE.md risks.
      # ---------------------------------------------------------------
      Environment:
        Variables:
          BUCKET_NAME: !Ref RedactedPlaceholder # [REDACTED]
          CRM_CONNECTIONS_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          ELEVENLABS_API_KEY: !Ref RedactedPlaceholder # [REDACTED - plaintext secret in deployed env]
          ELEVENLABS_MODEL: !Ref RedactedPlaceholder # [REDACTED]
          GROQ_API_KEY: !Ref RedactedPlaceholder # [REDACTED - plaintext secret in deployed env]
          GROQ_CONTEXT_TOKENS: !Ref RedactedPlaceholder # [REDACTED]
          GROQ_MODEL: !Ref RedactedPlaceholder # [REDACTED]
          GROQ_TPM_LIMIT: !Ref RedactedPlaceholder # [REDACTED]
          NOTIFICATIONS_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          NOTIFICATION_DEDUPE_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          PAGEINDEX_LLM_SUMMARY: !Ref RedactedPlaceholder # [REDACTED]
          PAGEINDEX_LOCK_TTL: !Ref RedactedPlaceholder # [REDACTED]
          PAGEINDEX_PREFIX: !Ref RedactedPlaceholder # [REDACTED]
          PAGEINDEX_RETRIEVAL_DEADLINE: !Ref RedactedPlaceholder # [REDACTED]
          RECORDINGS_TABLE: !Ref RedactedPlaceholder # [REDACTED]
          STT_START_TIMEOUT: !Ref RedactedPlaceholder # [REDACTED]
          STT_URL_EXPIRY: !Ref RedactedPlaceholder # [REDACTED]
          URL_EXPIRY: !Ref RedactedPlaceholder # [REDACTED]
          USERAPI_LAMBDA_NAME: !Ref RedactedPlaceholder # [REDACTED]
      # ---------------------------------------------------------------
      # TRIGGERS
      # This function is NOT wired to API Gateway. It is invoked by:
      #   1. S3 ObjectCreated on meeting-recorder-shubham-aps1,
      #      declared on the bucket's NotificationConfiguration above
      #      plus TranscribeRecordingS3InvokePermission below. It is
      #      NOT declared as a SAM S3 event, because a SAM S3 event
      #      requires SAM to own (create) the bucket, and this bucket
      #      already exists.
      #   2. An ASYNCHRONOUS lambda:InvokeFunction from userApi carrying
      #      a stt.completed payload (InvocationType=Event).
      # ---------------------------------------------------------------

      # ===========================================================================
      # LAMBDA RESOURCE POLICIES  --  who may invoke what
      #
      # The API-Gateway permissions below mirror the statements found on the
      # deployed functions. NOTE: the deployed userApi policy actually carries
      # THREE apigateway statements (sids apigw-invoke-userapi,
      # apigw-q87zfn5vyj-invoke, apigw-stt-webhook), two of which have identical
      # SourceArn conditions -- deploy-script accretion. Represented here as the
      # single distinct grant they collectively express.
      #
      # SAM also auto-generates its own invoke permissions from the HttpApi events
      # above; these explicit resources document what actually exists in AWS.
      #
      # There is NO resource-policy statement for the Lambda-to-Lambda invokes:
      # those are authorised by the CALLER's IAM role (userApi-invoke-transcribe
      # and transcribe-invoke-userapi inline policies above), which is the correct
      # and sufficient mechanism for same-account invocation.
      #
      # LAMBDA -> LAMBDA (both directions, both ASYNCHRONOUS, InvocationType=Event
      # confirmed at all four call sites in source):
      #   userApi --> transcribeRecording   reprocess, and stt.completed after the
      #                                     ElevenLabs webhook is verified
      #   transcribeRecording --> userApi   tasks.seed once a meeting completes
      # ===========================================================================

  UserApiApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    # Deployed statement sid: apigw-invoke-userapi
    Properties:
      FunctionName: !Ref UserApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MinuteXHttpApi}/*/*

  GetUploadUrlApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    # Deployed statement sid: apigw-invoke-getuploadurl
    Properties:
      FunctionName: !Ref GetUploadUrlFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MinuteXHttpApi}/*/*

  TranscribeRecordingS3InvokePermission:
    Type: AWS::Lambda::Permission
    # Deployed statement sid: s3-invoke-transcribe
    # This is what allows the bucket notification to fire the function.
    Properties:
      FunctionName: !Ref TranscribeRecordingFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: arn:aws:s3:::meeting-recorder-shubham-aps1

